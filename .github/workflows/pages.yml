name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Pages site
        # The static web app lives in web/. We publish exactly that
        # folder's contents. Since this repo is named "Qr-Vault" (not
        # "mahmadsoni.github.io"), Pages serves it at
        # https://mahmadsoni.github.io/Qr-Vault/ — the app uses only
        # relative asset paths, so it works correctly at that subpath.
        run: |
          mkdir -p _site
          rsync -a web/ _site/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
